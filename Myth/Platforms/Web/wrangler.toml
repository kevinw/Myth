name = "myth-game"
compatibility_date = "2026-06-06"
pages_build_output_dir = "../../bin/Release/net10.0/browser-wasm/AppBundle"

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "myth-feedback"
database_id = "54338262-e979-4384-8bd3-25f757b8e18e"

# Email Routing must be enabled on the domain used by FEEDBACK_FROM, and
# destination_address must be a verified destination address in that account.
[[send_email]]
name = "FEEDBACK_EMAIL"
destination_address = "kevinwatters@gmail.com"

[vars]
# From-address must be on a domain in this Cloudflare account with Email Routing.
FEEDBACK_FROM = "feedback@tiny-walk.com"
FEEDBACK_TO = "kevinwatters@gmail.com"
