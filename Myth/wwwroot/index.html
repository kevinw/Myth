<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<title>Myth</title>
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #05030a;
		}

		body {
			display: grid;
			place-items: center;
		}

		#game-shell {
			position: relative;
			aspect-ratio: 16 / 9;
			width: min(100vw, calc(100vh * 16 / 9));
			height: min(100vh, calc(100vw * 9 / 16));
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		#debug-toggle {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 2;
			width: 28px;
			height: 28px;
			border: 1px solid rgba(236, 226, 203, 0.55);
			background: rgba(10, 12, 16, 0.72);
			color: #f2ead7;
			font: 16px system-ui, sans-serif;
			line-height: 1;
			cursor: pointer;
		}

		#debug-overlay {
			position: absolute;
			top: 44px;
			right: 8px;
			bottom: 8px;
			z-index: 2;
			display: grid;
			grid-template-rows: auto auto 1fr;
			width: min(520px, calc(100% - 16px));
			border: 1px solid rgba(236, 226, 203, 0.38);
			background: rgba(8, 10, 14, 0.88);
			color: #f3ecd7;
			font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
		}

		#debug-overlay[hidden] {
			display: none;
		}

		#debug-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 7px 9px;
			border-bottom: 1px solid rgba(236, 226, 203, 0.18);
			background: rgba(255, 255, 255, 0.04);
		}

		#debug-clear {
			border: 1px solid rgba(236, 226, 203, 0.35);
			background: rgba(255, 255, 255, 0.08);
			color: inherit;
			font: inherit;
			padding: 3px 8px;
			cursor: pointer;
		}

		#debug-stats {
			min-height: 44px;
			padding: 8px 9px;
			border-bottom: 1px solid rgba(236, 226, 203, 0.18);
			color: #bfe7ff;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		#debug-log {
			overflow: auto;
			padding: 8px 9px;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.debug-line {
			margin: 0 0 5px;
		}

		.debug-warn {
			color: #ffd37a;
		}

		.debug-error {
			color: #ff8a8a;
		}

		#start-gate {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			background: #150e22;
			z-index: 1;
		}

		#start-panel {
			display: grid;
			gap: 14px;
			width: min(220px, calc(100vw - 48px));
		}

		#start-button {
			border: 1px solid #e0d3a7;
			background: #2f213f;
			color: #f5e9c8;
			font: 700 18px system-ui, sans-serif;
			padding: 14px 28px;
			cursor: pointer;
		}

		#start-button:disabled {
			opacity: 0.55;
			cursor: wait;
		}

		#start-progress {
			width: 100%;
			height: 8px;
			accent-color: #e0d3a7;
		}

		#start-gate[hidden] {
			display: none;
		}
	</style>
</head>
<body>
	<div id="game-shell">
		<canvas id="foster-canvas" width="1280" height="720"></canvas>
		<button id="debug-toggle" type="button" aria-label="Toggle debug overlay" aria-pressed="false">⚙</button>
		<div id="debug-overlay" hidden>
			<div id="debug-bar">
				<span>Console</span>
				<button id="debug-clear" type="button">Clear</button>
			</div>
			<div id="debug-stats"></div>
			<div id="debug-log" aria-live="polite"></div>
		</div>
	</div>
	<div id="start-gate">
		<div id="start-panel">
			<button id="start-button" type="button" disabled>Loading...</button>
			<progress id="start-progress" value="0" max="1"></progress>
		</div>
	</div>
	<script type="module" src="main.js"></script>
</body>
</html>
