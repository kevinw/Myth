<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<title>Myth</title>
	<style>
		:root {
			/* matches Room.DefaultBackdropColor (0x150e22) so the letterbox bars
			   blend with the game's default backdrop */
			--backdrop: #150e22;
			--mono: ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, "Liberation Mono", monospace;
		}

		/* Game-canvas defaults: no tap highlight, no text selection or callouts,
		   no double-tap/pinch zoom, no scroll/overscroll bounce. */
		* { -webkit-tap-highlight-color: transparent; }

		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: var(--backdrop);
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
			touch-action: none;
			overscroll-behavior: none;
			font-family: var(--mono);
		}

		body {
			display: grid;
			place-items: center;
		}

		#game-shell {
			position: relative;
			aspect-ratio: 16 / 9;
			width: min(100vw, calc(100vh * 16 / 9));
			height: min(100vh, calc(100vw * 9 / 16));
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}

		#reload-button {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 2;
			height: 28px;
			padding: 0 10px;
			border: 1px solid rgba(236, 226, 203, 0.55);
			background: rgba(10, 12, 16, 0.72);
			color: #f2ead7;
			line-height: 1;
			cursor: pointer;
			font: 700 12px var(--mono);
		}

		#reload-button[hidden] {
			display: none;
		}

		#start-gate {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			background: var(--backdrop);
			z-index: 1;
		}

		#start-gate[hidden] {
			display: none;
		}

		/* The Start button doubles as the loading bar: a fill grows left-to-right
		   from 0% to 100% via the --p custom property set in main.js. */
		#start-button {
			width: min(260px, calc(100vw - 48px));
			border: 1px solid #e0d3a7;
			color: #f5e9c8;
			font: 700 18px var(--mono);
			padding: 16px 28px;
			cursor: pointer;
			background-color: #2f213f;
			background-image: linear-gradient(to right,
				rgba(224, 211, 167, 0.40) var(--p, 0%),
				rgba(224, 211, 167, 0) var(--p, 0%));
			background-repeat: no-repeat;
			transition: background-image 0.1s linear;
		}

		#start-button:disabled {
			cursor: wait;
		}
	</style>
</head>
<body>
	<div id="game-shell">
		<canvas id="foster-canvas" width="1280" height="720"></canvas>
		<button id="reload-button" type="button" hidden>Reload</button>
	</div>
	<div id="start-gate">
	    <div style="text-align: center;">
			<div style="text-align: left; width: 400px; color: #efefef;">
			<p>Controls: Gamepad, or:</p>
			<p>A: Jump, X: Attack.</p>
			<p>Hold jump when hitting the ground to become one-dimensional.</p>
			<p>One-dimensional beings climb walls and move faster along surfaces.</p>
            </div>
    		<button id="start-button" type="button" disabled>Loading...</button>
		</div>
	</div>
	<script type="module" src="main.js"></script>
</body>
</html>
