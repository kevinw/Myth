name: Check Rooms

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

jobs:
  check-rooms:
    name: Load all rooms
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Fetch game assets and submodules
        run: |
          set -euo pipefail
          git lfs pull --exclude="Myth/Platforms/iOS,Myth/Production,Myth/Assets/Sources/Sounds,Myth/Assets/Sounds"
          git submodule update --init Foster Myth/Source/External/StringBuilder
          chmod +x Foster/tools/linux/shadercross

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Myth/Myth.csproj -c Debug -p:MythTestShip=true

      - name: Check rooms
        run: dotnet run --project Myth/Myth.csproj -c Debug -p:MythTestShip=true --no-build -- --check-rooms
