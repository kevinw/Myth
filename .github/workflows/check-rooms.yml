name: Check Rooms

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rooms:
    name: Load all rooms
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false
          clean: false

      # The runner's workspace persists, so native build trees stay incremental between runs.
      - name: Clean workspace
        run: git clean -ffdx -e ozz-runtime/

      - name: Update submodules
        run: git submodule update --init --force Foster Myth/Source/External/StringBuilder Myth/tools/ozz-animation

      # From Myth/, so the game's upward search for Assets can't find another folder first.
      - name: Check rooms
        working-directory: Myth
        run: dotnet run --project Myth.csproj -c Debug -p:MythTestShip=true -- --check-rooms
