name: Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  R2_BUCKET: myth-downloads
  MYTH_NOTARY_PROFILE: myth-notary

jobs:
  publish-macos:
    name: Publish macOS (Apple silicon)
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false

      - name: Update desktop submodules
        run: |
          set -euo pipefail
          git submodule update --init Foster Myth/Source/External/StringBuilder
          git -C Foster lfs pull

      # The arm64 shadercross binary depends on locally-built dylibs that aren't part
      # of Foster. Shipped MSL is committed; make it newer than Git's checkout mtimes
      # so MSBuild uses it rather than trying to rebuild it on the clean runner.
      - name: Use committed macOS shaders
        run: find Myth/Assets/Shaders/Compiled Foster/Framework/Content/Shaders/Compiled -name '*.msl' -exec touch {} +

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check macOS release configuration
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 \
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret or variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Store notarization credentials
        shell: bash
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool store-credentials "$MYTH_NOTARY_PROFILE" \
            --key "$key_path" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID"

      - name: Verify Developer ID identity
        run: security find-identity -v -p codesigning | grep 'Developer ID Application'

      - name: Publish and notarize
        run: node Myth/tools/publish-desktop.mjs --notarize

      - name: Name macOS build
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          file="Myth-${GITHUB_SHA:0:8}-mac.zip"
          cp Myth/bin/publish/Myth.zip "$RUNNER_TEMP/$file"
          echo "file=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"

      - name: Save macOS build
        uses: actions/upload-artifact@v7
        with:
          name: myth-macos
          path: ${{ steps.archive.outputs.file }}
          retention-days: 1
          if-no-files-found: error

  compile-windows-shaders:
    name: Compile Windows shaders
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Fetch Linux shader compiler
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init Foster
          git -C Foster lfs pull --include='tools/linux/**'
          chmod +x Foster/tools/linux/shadercross

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compile DXIL
        run: |
          set -euo pipefail
          find Myth/Assets/Shaders/Compiled Foster/Framework/Content/Shaders/Compiled -name '*.dxil' -delete
          dotnet msbuild Foster/Framework/Foster.Framework.csproj -t:CompileShaders -p:ShaderPlatform=windows
          dotnet msbuild Myth/Myth.csproj -t:CompileShaders -p:ShaderPlatform=windows
          tar -cf "$RUNNER_TEMP/windows-shaders.tar" \
            Myth/Assets/Shaders/Compiled/*.dxil \
            Foster/Framework/Content/Shaders/Compiled/*.dxil

      - name: Save Windows shaders
        uses: actions/upload-artifact@v7
        with:
          name: windows-shaders
          path: ${{ runner.temp }}/windows-shaders.tar
          retention-days: 1
          if-no-files-found: error

  publish-windows:
    name: Publish Windows (x64, unsigned)
    needs: compile-windows-shaders
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Update desktop submodules
        shell: bash
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init Foster Myth/Source/External/StringBuilder
          git -C Foster lfs pull --include='Framework/Internal/Native/win-x64/**'

      - name: Restore compiled Windows shaders
        uses: actions/download-artifact@v8
        with:
          name: windows-shaders
          path: ${{ runner.temp }}/windows-shaders

      - name: Install compiled Windows shaders
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/windows-shaders/windows-shaders.tar"
          find Myth/Assets/Shaders/Compiled Foster/Framework/Content/Shaders/Compiled -name '*.dxil' -exec touch {} +

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows build
        run: node Myth/tools/publish-windows.mjs

      - name: Package Windows build
        id: archive
        shell: pwsh
        run: |
          $file = "Myth-$($env:GITHUB_SHA.Substring(0, 8))-windows-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $file
          Compress-Archive -Path Myth/bin/publish/Myth -DestinationPath $archive
          "file=$archive" >> $env:GITHUB_OUTPUT

      - name: Save Windows build
        uses: actions/upload-artifact@v7
        with:
          name: myth-windows
          path: ${{ steps.archive.outputs.file }}
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish desktop downloads
    if: ${{ always() && needs.publish-macos.result == 'success' }}
    needs:
      - publish-macos
      - publish-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Restore macOS build
        uses: actions/download-artifact@v8
        with:
          name: myth-macos
          path: ${{ runner.temp }}/release

      - name: Restore Windows build
        if: ${{ needs.publish-windows.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: myth-windows
          path: ${{ runner.temp }}/release

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          previous_sha=""
          if releases="$(curl -fsS 'https://myth-game.pages.dev/download/releases.json')"; then
            previous_sha="$(printf '%s' "$releases" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const current = process.argv[1];
                const release = JSON.parse(input).releases.find(value => value.sha !== current);
                process.stdout.write(release?.sha ?? "");
              });
            ' "$GITHUB_SHA")"
          else
            echo "No published release index yet; using the push range for this changelog."
          fi
          node Myth/tools/write-desktop-release.mjs \
            "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release" "$GITHUB_SHA" "$published_at" "$previous_sha" "$BEFORE_SHA"
          commit_count="$(git rev-list --count "$GITHUB_SHA")"
          reverse_order="$(node -p 'String(999999999999 - Number(process.argv[1])).padStart(12, "0")' "$commit_count")"
          echo "descriptor=releases/$reverse_order-$GITHUB_SHA.json" >> "$GITHUB_OUTPUT"

      - name: Upload desktop builds to R2
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESCRIPTOR: ${{ steps.release.outputs.descriptor }}
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/release/*.zip; do
            file="$(basename "$archive")"
            npx wrangler@latest r2 object put "$R2_BUCKET/$file" \
              --remote \
              --file "$archive" \
              --content-type application/zip \
              --content-disposition "attachment; filename=\"$file\"" \
              --cache-control "public, max-age=31536000, immutable"
          done
          npx wrangler@latest r2 object put "$R2_BUCKET/$DESCRIPTOR" \
            --remote \
            --file "$RUNNER_TEMP/release.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
