name: Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build
  cancel-in-progress: false

env:
  MYTH_WORLD: Myth
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  R2_BUCKET: myth-downloads
  MYTH_NOTARY_PROFILE: myth-notary

jobs:
  publish-macos:
    name: Publish macOS (Apple silicon)
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false

      - name: Update desktop submodules
        run: |
          set -euo pipefail
          git submodule update --init Foster Myth/Source/External/StringBuilder Myth/tools/ozz-animation

      - name: Identify Ozz runtime sources
        id: macos-ozz
        run: echo "revision=$(git -C Myth/tools/ozz-animation rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache myth_ozz
        id: cache-macos-ozz
        uses: actions/cache@v5
        with:
          path: Myth/obj/desktop/ozz-runtime
          key: myth-ozz-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-ozz.outputs.revision }}-${{ hashFiles('Myth/tools/rig-baker/ozz_runtime.cc', 'Myth/tools/rig-baker/CMakeLists.txt', 'Myth/tools/rig-baker/build-runtime.mjs') }}

      - name: Restore myth_ozz timestamps
        if: steps.cache-macos-ozz.outputs.cache-hit == 'true'
        run: find Myth/obj/desktop/ozz-runtime -type f -exec touch {} +

      - name: Force fresh Foster shader compilation
        run: find Foster/Framework/Content/Shaders/Compiled -name '*.msl' -delete

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check macOS release configuration
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 \
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret or variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Store notarization credentials
        shell: bash
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool store-credentials "$MYTH_NOTARY_PROFILE" \
            --key "$key_path" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID"

      - name: Verify Developer ID identity
        run: security find-identity -v -p codesigning | grep 'Developer ID Application'

      - name: Publish and notarize
        run: node Myth/tools/publish-macos.mjs --notarize

      - name: Name macOS build
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          file="Myth-${GITHUB_SHA:0:8}-mac.zip"
          cp Myth/bin/publish/Myth.zip "$RUNNER_TEMP/$file"
          echo "file=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"

      - name: Upload macOS build to R2
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FILE: ${{ steps.archive.outputs.file }}
        run: |
          set -euo pipefail
          name="$(basename "$FILE")"
          npx wrangler@latest r2 object put "$R2_BUCKET/$name" \
            --remote \
            --file "$FILE" \
            --content-type application/zip \
            --content-disposition "attachment; filename=\"$name\"" \
            --cache-control "public, max-age=31536000, immutable"

  compile-windows-shaders:
    name: Compile Windows shaders
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Fetch Linux shader compiler
        run: |
          set -euo pipefail
          git submodule update --init Foster
          chmod +x Foster/tools/linux/shadercross

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compile DXIL
        run: |
          set -euo pipefail
          find Foster/Framework/Content/Shaders/Compiled -name '*.dxil' -delete
          dotnet msbuild Foster/Framework/Foster.Framework.csproj -t:CompileShaders -p:ShaderPlatform=windows
          dotnet msbuild Myth/Myth.csproj -t:CompileShaders -p:ShaderPlatform=windows
          tar -cf "$RUNNER_TEMP/windows-shaders.tar" \
            Myth/Assets/Shaders/Compiled/*.dxil \
            Foster/Framework/Content/Shaders/Compiled/*.dxil

      - name: Stage Windows shaders in R2
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@latest r2 object put "$R2_BUCKET/ci/windows-shaders-$GITHUB_SHA.tar" \
            --remote \
            --file "$RUNNER_TEMP/windows-shaders.tar"

  publish-windows:
    name: Publish Windows (x64, unsigned)
    needs: compile-windows-shaders
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Update desktop submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init Foster Myth/Source/External/StringBuilder Myth/tools/ozz-animation

      - name: Identify Ozz runtime sources
        id: windows-ozz
        shell: bash
        run: echo "revision=$(git -C Myth/tools/ozz-animation rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache myth_ozz
        id: cache-windows-ozz
        uses: actions/cache@v5
        with:
          path: Myth/obj/desktop/ozz-runtime
          key: myth-ozz-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-ozz.outputs.revision }}-${{ hashFiles('Myth/tools/rig-baker/ozz_runtime.cc', 'Myth/tools/rig-baker/CMakeLists.txt', 'Myth/tools/rig-baker/build-runtime.mjs') }}

      - name: Restore myth_ozz timestamps
        if: steps.cache-windows-ozz.outputs.cache-hit == 'true'
        shell: bash
        run: find Myth/obj/desktop/ozz-runtime -type f -exec touch {} +

      - name: Restore compiled Windows shaders
        working-directory: Myth/Platforms/Web
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@latest r2 object get "$R2_BUCKET/ci/windows-shaders-$GITHUB_SHA.tar" \
            --remote \
            --file "$RUNNER_TEMP/windows-shaders.tar"

      - name: Install compiled Windows shaders
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$(cygpath -u "$RUNNER_TEMP")/windows-shaders.tar"
          find Myth/Assets/Shaders/Compiled Foster/Framework/Content/Shaders/Compiled -name '*.dxil' -exec touch {} +

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows build
        run: node Myth/tools/publish-windows.mjs

      - name: Package Windows build
        id: archive
        shell: pwsh
        run: |
          $file = "Myth-$($env:GITHUB_SHA.Substring(0, 8))-windows-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $file
          Compress-Archive -Path Myth/bin/publish/Myth -DestinationPath $archive
          "file=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build to R2
        working-directory: Myth/Platforms/Web
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FILE: ${{ steps.archive.outputs.file }}
        run: |
          set -euo pipefail
          name="$(basename "$FILE")"
          npx wrangler@latest r2 object put "$R2_BUCKET/$name" \
            --remote \
            --file "$FILE" \
            --content-type application/zip \
            --content-disposition "attachment; filename=\"$name\"" \
            --cache-control "public, max-age=31536000, immutable"

  publish-linux:
    name: Publish Linux (x64)
    runs-on: [self-hosted, local-mac]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Update desktop submodules
        run: git submodule update --init Foster Myth/Source/External/StringBuilder Myth/tools/ozz-animation

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux cross toolchain
        run: brew install zig llvm

      - name: Force fresh Foster shader compilation
        run: find Foster/Framework/Content/Shaders/Compiled \( -name '*.msl' -o -name '*.spv' \) -delete

      - name: Publish Linux build
        run: node Myth/tools/publish-linux.mjs

      - name: Package Linux build
        id: archive
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/Myth-${GITHUB_SHA:0:8}-linux-x64.zip"
          cd Myth/bin/publish
          zip -r -y "$file" Myth-linux
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload Linux build to R2
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FILE: ${{ steps.archive.outputs.file }}
        run: |
          set -euo pipefail
          name="$(basename "$FILE")"
          npx wrangler@latest r2 object put "$R2_BUCKET/$name" \
            --remote \
            --file "$FILE" \
            --content-type application/zip \
            --content-disposition "attachment; filename=\"$name\"" \
            --cache-control "public, max-age=31536000, immutable"

  publish-itch:
    name: itch.io (${{ matrix.channel }})
    if: ${{ !cancelled() }}
    needs: [publish-macos, publish-windows, publish-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: mac-demo
            archive: mac
            result: ${{ needs.publish-macos.result }}
          - channel: windows-demo
            archive: windows-x64
            result: ${{ needs.publish-windows.result }}
          - channel: linux-demo
            archive: linux-x64
            result: ${{ needs.publish-linux.result }}

    steps:
      - name: Install butler
        if: matrix.result == 'success'
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version

      - name: Download build from R2
        if: matrix.result == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          npx wrangler@latest r2 object get "$R2_BUCKET/Myth-${GITHUB_SHA:0:8}-$ARCHIVE.zip" \
            --remote --file "$RUNNER_TEMP/game.zip"

      - name: Upload to itch.io
        if: matrix.result == 'success'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          : "${BUTLER_API_KEY:?Missing GitHub secret BUTLER_API_KEY}"
          "$RUNNER_TEMP/butler/butler" push "$RUNNER_TEMP/game.zip" "keelo/humanquestions:$CHANNEL" \
            --userversion "${GITHUB_SHA:0:8}"

  publish-release:
    name: Publish desktop downloads
    if: ${{ always() && needs.publish-macos.result == 'success' }}
    needs:
      - publish-macos
      - publish-windows
      - publish-linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          WINDOWS_RESULT: ${{ needs.publish-windows.result }}
          LINUX_RESULT: ${{ needs.publish-linux.result }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          mkdir -p "$RUNNER_TEMP/release"
          touch "$RUNNER_TEMP/release/Myth-$short_sha-mac.zip"
          if [[ "$WINDOWS_RESULT" == success ]]; then
            touch "$RUNNER_TEMP/release/Myth-$short_sha-windows-x64.zip"
          fi
          if [[ "$LINUX_RESULT" == success ]]; then
            touch "$RUNNER_TEMP/release/Myth-$short_sha-linux-x64.zip"
          fi
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          previous_sha=""
          if releases="$(curl -fsS 'https://myth-game.pages.dev/download/releases.json')"; then
            previous_sha="$(printf '%s' "$releases" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const current = process.argv[1];
                const release = JSON.parse(input).releases.find(value => value.sha !== current);
                process.stdout.write(release?.sha ?? "");
              });
            ' "$GITHUB_SHA")"
          else
            echo "No published release index yet; using the push range for this changelog."
          fi
          node Myth/tools/write-desktop-release.mjs \
            "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release" "$GITHUB_SHA" "$published_at" "$previous_sha" "$BEFORE_SHA"
          commit_count="$(git rev-list --count "$GITHUB_SHA")"
          reverse_order="$(node -p 'String(999999999999 - Number(process.argv[1])).padStart(12, "0")' "$commit_count")"
          echo "descriptor=releases/$reverse_order-$GITHUB_SHA.json" >> "$GITHUB_OUTPUT"

      - name: Publish release descriptor
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESCRIPTOR: ${{ steps.release.outputs.descriptor }}
        run: |
          set -euo pipefail
          npx wrangler@latest r2 object delete "$R2_BUCKET/ci/windows-shaders-$GITHUB_SHA.tar" --remote || true
          npx wrangler@latest r2 object put "$R2_BUCKET/$DESCRIPTOR" \
            --remote \
            --file "$RUNNER_TEMP/release.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
