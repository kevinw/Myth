name: Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build
  cancel-in-progress: false

env:
  MYTH_WORLD: Myth
  R2_BUCKET: myth-downloads
  MYTH_NOTARY_PROFILE: myth-notary
  WRANGLER_VERSION: 4.133.0

jobs:
  # Everything builds on the local Mac: macOS natively, Windows and Linux cross-built (see
  # tools/publish-windows.mjs and tools/publish-linux.mjs). windows-build.yml builds on Windows.
  desktop:
    name: Publish desktop builds
    runs-on: [self-hosted, local-mac]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          submodules: false
          clean: false

      # The runner's workspace persists, so native build trees stay incremental between runs.
      - name: Clean workspace
        run: git clean -ffdx -e ozz-runtime/

      - name: Update desktop submodules
        run: git submodule update --init --force Foster Myth/Source/External/StringBuilder Myth/tools/ozz-animation

      # Git doesn't preserve mtimes, so Foster's committed compiled shaders would look up to date.
      - name: Force fresh Foster shader compilation
        run: find Foster/Framework/Content/Shaders/Compiled \( -name '*.msl' -o -name '*.dxil' -o -name '*.spv' \) -delete

      - name: Check release configuration
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 \
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            BUTLER_API_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret or variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Bake world map
        run: node Myth/tools/check-world-map-bake.mjs "$MYTH_WORLD"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Store notarization credentials
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool store-credentials "$MYTH_NOTARY_PROFILE" \
            --key "$key_path" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID"

      - name: Verify Developer ID identity
        run: security find-identity -v -p codesigning | grep 'Developer ID Application'

      # The macOS publish also checks every room, so the cross builds skip it.
      - name: Publish macOS build
        run: node Myth/tools/publish-macos.mjs --notarize

      # Windows and Linux may fail without holding back the macOS release; the last step reports it.
      - name: Publish Windows build
        id: windows
        continue-on-error: true
        run: node Myth/tools/publish-windows.mjs --skip-check-rooms

      - name: Publish Linux build
        id: linux
        continue-on-error: true
        run: node Myth/tools/publish-linux.mjs --skip-check-rooms

      - name: Package builds
        env:
          WINDOWS: ${{ steps.windows.outcome }}
          LINUX: ${{ steps.linux.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          rm -rf "$out"
          mkdir -p "$out"
          short_sha="${GITHUB_SHA:0:8}"
          cd Myth/bin/publish
          cp Myth.zip "$out/Myth-$short_sha-mac.zip"
          if [[ "$WINDOWS" == success ]]; then zip -r -q "$out/Myth-$short_sha-windows-x64.zip" Myth; fi
          if [[ "$LINUX" == success ]]; then zip -r -q -y "$out/Myth-$short_sha-linux-x64.zip" Myth-linux; fi
          ls -la "$out"

      - name: Upload builds to R2
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/release/*.zip; do
            name="$(basename "$file")"
            npx "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/$name" \
              --remote \
              --file "$file" \
              --content-type application/zip \
              --content-disposition "attachment; filename=\"$name\"" \
              --cache-control "public, max-age=31536000, immutable"
          done

      # The download page lists releases/*.json; write-desktop-release.mjs lists whichever zips exist.
      - name: Publish release descriptor
        working-directory: Myth/Platforms/Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous_sha=""
          if releases="$(curl -fsS 'https://myth-game.pages.dev/download/releases.json')"; then
            previous_sha="$(printf '%s' "$releases" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const release = JSON.parse(input).releases.find(value => value.sha !== process.argv[1]);
                process.stdout.write(release?.sha ?? "");
              });
            ' "$GITHUB_SHA")"
          else
            echo "No published release index yet; using the push range for this changelog."
          fi
          node ../../tools/write-desktop-release.mjs \
            "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$previous_sha" "$BEFORE_SHA"
          commit_count="$(git rev-list --count "$GITHUB_SHA")"
          reverse_order="$(node -p 'String(999999999999 - Number(process.argv[1])).padStart(12, "0")' "$commit_count")"
          npx "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/releases/$reverse_order-$GITHUB_SHA.json" \
            --remote \
            --file "$RUNNER_TEMP/release.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
          node -e '
            const release = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const lines = [
              `## Desktop build ${release.shortSha}`,
              "",
              "| Platform | Download |",
              "| --- | --- |",
              ...release.downloads.map(d =>
                `| ${d.platform} (${d.architecture}${d.unsigned ? ", unsigned" : ""}) | [${d.file}](https://myth-game.pages.dev/download/${d.file}) |`),
            ];
            if (release.commits?.length)
              lines.push("", "### Changes", ...release.commits.map(c => `- ${c}`));
            console.log(lines.join("\n"));
          ' "$RUNNER_TEMP/release.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://broth.itch.zone/butler/darwin-arm64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          rm -rf "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          short_sha="${GITHUB_SHA:0:8}"
          for platform in mac windows-x64 linux-x64; do
            file="$RUNNER_TEMP/release/Myth-$short_sha-$platform.zip"
            if [[ -f "$file" ]]; then
              "$RUNNER_TEMP/butler/butler" push "$file" "keelo/humanquestions:${platform%-x64}-demo" --userversion "$short_sha"
            fi
          done

      - name: Report failed cross builds
        if: steps.windows.outcome != 'success' || steps.linux.outcome != 'success'
        env:
          WINDOWS: ${{ steps.windows.outcome }}
          LINUX: ${{ steps.linux.outcome }}
        run: |
          echo "::error::Windows publish: $WINDOWS, Linux publish: $LINUX"
          exit 1
