name: Browser Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

jobs:
  build-browser:
    name: Build browser-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Cache .NET SDK and workloads
        uses: actions/cache@v5
        with:
          path: .dotnet
          key: dotnet-sdk-workloads-${{ runner.os }}-10.0.x-wasm-tools

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Restore packages
        run: dotnet restore TinyLink/TinyLink.csproj -r browser-wasm /p:TinyLinkBrowser=true

      - name: Build browser app
        run: dotnet build TinyLink/TinyLink.csproj -c Release -r browser-wasm --no-restore /p:TinyLinkBrowser=true /p:ShaderPlatform=

      - name: Upload browser app bundle
        uses: actions/upload-artifact@v7
        with:
          name: myth-browser-wasm
          path: TinyLink/bin/Release/net10.0/browser-wasm/AppBundle
          if-no-files-found: error

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-wrangler
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy TinyLink/bin/Release/net10.0/browser-wasm/AppBundle --project-name myth-game --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
