name: Browser Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

jobs:
  build-browser:
    name: Build browser-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      # Fetch only the LFS objects + submodule the browser build needs. Skips
      # ~137 MB of iOS-only binaries (xcframeworks, iOS FMOD libs), dev-only
      # Production assets, and the iOS cimgui-src submodule.
      - name: Fetch browser LFS + Foster submodule
        run: |
          set -euo pipefail
          git lfs pull --exclude="Myth/Platforms/iOS,Myth/Production"
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init Foster
          git -C Foster lfs pull --exclude="Framework/Internal/Native/ios,Framework/Internal/Native/win-x64,Framework/Internal/Native/osx,tools/macos"
          git submodule update --init --remote Myth/Source/External/StringBuilder

      - name: Cache .NET SDK and workloads
        id: cache-dotnet
        uses: actions/cache@v5
        with:
          path: .dotnet
          key: dotnet-sdk-workloads-${{ runner.os }}-10.0.x-wasm-tools

      # On a cache hit, .dotnet already contains the wasm-tools workload, so skip the
      # ~30s `dotnet workload install`. Only install workloads when the cache is cold.
      - name: Set up .NET (cold cache - install workload)
        if: steps.cache-dotnet.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Set up .NET (warm cache)
        if: steps.cache-dotnet.outputs.cache-hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Web shaders compile HLSL -> SPIRV (dxc) -> WGSL (naga). The native
      # asset-pack build instead uses the bundled Foster/tools/linux/shadercross.
      - name: Install dxc (HLSL -> SPIRV)
        run: |
          set -euo pipefail
          dxc_url="https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz"
          dxc_dir="$RUNNER_TEMP/dxc"
          mkdir -p "$dxc_dir"
          curl -fsSL "$dxc_url" | tar xz -C "$dxc_dir"
          echo "$dxc_dir/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$dxc_dir/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache naga-cli
        id: cache-naga
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-29.0.3-${{ runner.os }}

      - name: Install naga-cli (SPIRV -> WGSL)
        if: steps.cache-naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 29.0.3 --locked

      # Git can't preserve mtimes, so MSBuild's incremental check can't tell when a
      # committed .wgsl/.spv is stale relative to its .hlsl. Delete them so every CI
      # run recompiles from source and the deployed shaders are always up to date.
      - name: Clean compiled shaders (force fresh compilation)
        run: |
          find Myth/Assets/Shaders Foster/Framework/Content/Shaders \
            -path '*/Compiled/*' \( -name '*.wgsl' -o -name '*.spv' \) -delete -print

      - name: Build visual asset pack
        working-directory: Myth
        run: dotnet run --project Myth.csproj -c Release -- --build-asset-pack Assets/Packed/Visuals

      # --aot: full WebAssembly AOT for snappier runtime perf. Requires the Foster
      # fork's SDL3.cs UnmanagedCallConv strip (committed) or mono-aot-cross SGen-asserts.
      # The wasm-tools workload already provides the AOT cross-compiler + emscripten packs.
      - name: Publish browser app (AOT)
        run: node Myth/tools/browser-dotnet.mjs publish -c Release --aot

      - name: Upload browser app bundle
        uses: actions/upload-artifact@v7
        with:
          name: myth-browser-wasm
          path: Myth/bin/Release/net10.0/browser-wasm/AppBundle
          if-no-files-found: error

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-wrangler
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy Myth/bin/Release/net10.0/browser-wasm/AppBundle --project-name myth-game --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
