name: Browser Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-browser:
    name: Build browser-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out Foster
        run: git clone --depth 1 https://codeberg.org/kevinw/Foster.git ../Foster

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache .NET packages and workloads
        id: dotnet-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/template-packs
            ~/.dotnet/toolResolverCache
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/template-packs
            ${{ env.DOTNET_ROOT }}/toolResolverCache
          key: dotnet-browser-${{ runner.os }}-${{ hashFiles('.github/workflows/browser-build.yml', 'TinyLink/TinyLink.csproj', 'TinyLink/Source/TinyLink.Core.csproj') }}
          restore-keys: |
            dotnet-browser-${{ runner.os }}-

      - name: Install browser wasm workload
        run: dotnet workload install wasm-tools

      - name: Restore .NET workloads
        run: dotnet workload restore TinyLink/TinyLink.csproj /p:TinyLinkBrowser=true

      - name: Restore packages
        run: dotnet restore TinyLink/TinyLink.csproj -r browser-wasm /p:TinyLinkBrowser=true

      - name: Build browser app
        run: dotnet build TinyLink/TinyLink.csproj -c Release -r browser-wasm --no-restore /p:TinyLinkBrowser=true /p:ShaderPlatform=

      - name: Upload browser app bundle
        uses: actions/upload-artifact@v4
        with:
          name: myth-browser-wasm
          path: TinyLink/bin/Release/net10.0/browser-wasm/AppBundle
          if-no-files-found: error

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-wrangler
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy TinyLink/bin/Release/net10.0/browser-wasm/AppBundle --project-name myth-game --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
